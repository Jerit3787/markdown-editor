<!DOCTYPE html>
<html lang="en">
<head>

<title>Markdown Editor — Live Preview & Real-Time Collaboration</title>
<meta name="description" content="A fast, free markdown editor with live preview, multiple documents, real-time multi-user collaboration, and export to Markdown, HTML, PDF, or plain text. No account needed.">
<meta name="theme-color" content="#2563eb">
<link rel="canonical" href="https://editor.danplace.tech/">

<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/favicon-192.png">

<meta property="og:url" content="https://editor.danplace.tech/">
<meta property="og:title" content="Markdown Editor — Live Preview & Real-Time Collaboration">
<meta property="og:description" content="A fast, free markdown editor with live preview, multiple documents, real-time multi-user collaboration, and export to Markdown, HTML, PDF, or plain text.">

<meta property="og:image:width" content="1200">

<meta name="twitter:title" content="Markdown Editor — Live Preview & Real-Time Collaboration">
<meta name="twitter:description" content="A fast, free markdown editor with live preview, multiple documents, real-time multi-user collaboration, and export to Markdown, HTML, PDF, or plain text.">
<meta name="twitter:image" content="https://editor.danplace.tech/og-image.png">

<!-- CodeMirror 5 (editor) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/overlay.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/gfm/gfm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/continuelist.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/placeholder.min.js"></script>

<!-- Markdown rendering + sanitizing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.11/purify.min.js"></script>

<!-- PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

     referenced everywhere via <svg class="icon"><use href="#icon-name"/></svg>
     so every icon renders as a crisp, theme-colored vector instead of a
     platform-dependent emoji glyph. -->

  </symbol>
  <symbol id="icon-chevron-down" viewBox="0 0 24 24">
    <path d="m6 9 6 6 6-6" />
  </symbol>
  <symbol id="icon-code" viewBox="0 0 24 24">
    <path d="m16 18 6-6-6-6" />
    <path d="m8 6-6 6 6 6" />
  </symbol>
  <symbol id="icon-copy" viewBox="0 0 24 24">
    <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
  </symbol>
  <symbol id="icon-download" viewBox="0 0 24 24">
    <path d="M12 15V3" />
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
    <path d="m7 10 5 5 5-5" />
  </symbol>
  <symbol id="icon-ellipsis-vertical" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="1" />
    <circle cx="12" cy="5" r="1" />
    <circle cx="12" cy="19" r="1" />
  </symbol>
  <symbol id="icon-image" viewBox="0 0 24 24">
    <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
    <circle cx="9" cy="9" r="2" />
    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
  </symbol>
  <symbol id="icon-link" viewBox="0 0 24 24">
    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
  </symbol>
  <symbol id="icon-list-ordered" viewBox="0 0 24 24">
    <path d="M11 5h10" />
    <path d="M11 12h10" />
    <path d="M11 19h10" />
    <path d="M4 4h1v5" />
    <path d="M4 9h2" />
    <path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02" />
  </symbol>
  <symbol id="icon-list" viewBox="0 0 24 24">
    <path d="M3 5h.01" />
    <path d="M3 12h.01" />
    <path d="M3 19h.01" />
    <path d="M8 5h13" />
    <path d="M8 12h13" />
    <path d="M8 19h13" />
  </symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24">
    <path d="M4 5h16" />
    <path d="M4 12h16" />
    <path d="M4 19h16" />
  </symbol>
  <symbol id="icon-moon" viewBox="0 0 24 24">
    <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
  </symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24">
    <path d="M5 12h14" />
    <path d="M12 5v14" />
  </symbol>
  <symbol id="icon-quote" viewBox="0 0 24 24">
    <path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z" />
    <path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z" />
  </symbol>
  <symbol id="icon-square-check" viewBox="0 0 24 24">
    <rect width="18" height="18" x="3" y="3" rx="2" />
    <path d="m9 12 2 2 4-4" />
  </symbol>
  <symbol id="icon-strikethrough" viewBox="0 0 24 24">
    <path d="M16 4H9a3 3 0 0 0-2.83 4" />
    <path d="M14 12a4 4 0 0 1 0 8H6" />
    <line x1="4" x2="20" y1="12" y2="12" />
  </symbol>
  <symbol id="icon-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2" />
    <path d="M12 20v2" />
    <path d="m4.93 4.93 1.41 1.41" />
    <path d="m17.66 17.66 1.41 1.41" />
    <path d="M2 12h2" />
    <path d="M20 12h2" />
    <path d="m6.34 17.66-1.41 1.41" />
    <path d="m19.07 4.93-1.41 1.41" />
  </symbol>
  <symbol id="icon-table" viewBox="0 0 24 24">
    <path d="M12 3v18" />
    <rect width="18" height="18" x="3" y="3" rx="2" />
    <path d="M3 9h18" />
    <path d="M3 15h18" />
  </symbol>
  <symbol id="icon-upload" viewBox="0 0 24 24">
    <path d="M12 3v12" />
    <path d="m17 8-5-5-5 5" />
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
  </symbol>
  <symbol id="icon-users" viewBox="0 0 24 24">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
    <path d="M16 3.128a4 4 0 0 1 0 7.744" />
    <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
    <circle cx="9" cy="7" r="4" />
  </symbol>
  <symbol id="icon-x" viewBox="0 0 24 24">
    <path d="M18 6 6 18" />
    <path d="m6 6 12 12" />
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24">
    <path d="M20 6 9 17l-5-5" />
  </symbol>
  <symbol id="icon-external-link" viewBox="0 0 24 24">
    <path d="M15 3h6v6" />
    <path d="M10 14 21 3" />
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
  </symbol>
  <symbol id="icon-github" viewBox="0 0 24 24">
    <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
    <path d="M9 18c-4.51 2-5-2-7-2" />
  </symbol>
  <symbol id="icon-log-out" viewBox="0 0 24 24">
    <path d="m16 17 5-5-5-5" />
    <path d="M21 12H9" />
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
  </symbol>
</svg>

<div id="app">

  <!-- Top bar -->
  <header id="topbar">
    <button id="sidebarToggle" class="icon-btn" title="Toggle documents panel" aria-label="Toggle documents panel"><svg class="icon"><use href="#icon-menu"></use></svg></button>
    <div id="brand"><img src="/logo.svg" width="18" height="18" alt=""> Markdown Editor</div>

    <input id="docTitle" type="text" value="Untitled" spellcheck="false" aria-label="Document title">

    <div id="saveStatus">Saved</div>

    <div id="presenceBar" class="presence-bar" hidden></div>

    <div class="spacer"></div>

    <!-- On mobile this whole cluster becomes a right-side slide-in panel
         (see #moreBtn below) instead of wrapping the topbar to a 2nd row. -->
    <div id="topbarTools" class="topbar-tools">
      <div class="view-toggle" role="group" aria-label="View mode">
        <button class="view-btn" data-view="editor" title="Editor only">Editor</button>
        <button class="view-btn active" data-view="split" title="Split view">Split</button>
        <button class="view-btn" data-view="preview" title="Preview only">Preview</button>
      </div>

      <button id="themeToggle" class="icon-btn" title="Toggle dark/light theme" aria-label="Toggle theme"><svg class="icon"><use id="themeIconUse" href="#icon-moon"></use></svg><span class="tool-label">Dark mode</span></button>

      <div class="dropdown">
        <button id="shareBtn" class="icon-btn" title="Live collaboration" aria-label="Share for live collaboration"><svg class="icon"><use href="#icon-users"></use></svg><span class="tool-label">Collaborate</span></button>
        <div id="shareMenu" class="dropdown-menu share-menu">
          <div class="share-row">
            <span id="collabStatusDot" class="status-dot status-idle"></span>
            <span id="collabStatusText">Not shared</span>
          </div>
          <div class="share-row" id="shareLinkRow" hidden>
            <input id="shareLinkInput" type="text" readonly aria-label="Share link">
            <button id="copyShareLink" class="secondary-btn" type="button"><svg class="icon"><use href="#icon-copy"></use></svg> <span>Copy</span></button>
          </div>
          <button id="startShareBtn" class="primary-btn" type="button">Start collaborating</button>
          <button id="stopShareBtn" class="secondary-btn" type="button" hidden>Stop sharing</button>
          <div class="share-row share-name-row">
            <label for="collabNameInput">Your name</label>
            <input id="collabNameInput" type="text" maxlength="24">
          </div>
        </div>
      </div>

      <div class="dropdown">
        <button id="gistBtn" class="icon-btn" title="GitHub Gist" aria-label="GitHub Gist"><svg class="icon"><use href="#icon-github"></use></svg><span class="tool-label">GitHub Gist</span></button>
        <div id="gistMenu" class="dropdown-menu share-menu">
          <div class="share-row">
            <span id="gistStatusDot" class="status-dot status-idle"></span>
            <span id="gistStatusText">Not connected</span>
          </div>

          <div class="share-row" id="gistTokenRow">
            <input id="gistTokenInput" type="password" placeholder="ghp_... (gist scope)" aria-label="GitHub personal access token">
            <button id="gistConnectBtn" class="secondary-btn" type="button">Connect</button>
          </div>
          <a id="gistTokenLink" class="menu-link" href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Markdown+Editor" target="_blank" rel="noopener">Create a token <svg class="icon"><use href="#icon-external-link"></use></svg></a>

          <button id="gistPublishBtn" class="primary-btn" type="button" hidden>Publish as Gist</button>
          <a id="gistViewLink" class="menu-link" href="#" target="_blank" rel="noopener" hidden>View Gist <svg class="icon"><use href="#icon-external-link"></use></svg></a>
          <button id="gistDisconnectBtn" class="secondary-btn" type="button" hidden><svg class="icon"><use href="#icon-log-out"></use></svg> Disconnect</button>

          <div class="share-row share-name-row">
            <label for="gistOpenInput">Open a Gist</label>
            <input id="gistOpenInput" type="text" placeholder="URL or ID">
          </div>
          <button id="gistOpenBtn" class="secondary-btn" type="button">Open</button>
        </div>
      </div>

      <div class="dropdown">
        <button id="exportBtn" class="primary-btn">Export <svg class="icon"><use href="#icon-chevron-down"></use></svg></button>
        <div id="exportMenu" class="dropdown-menu">
          <button data-export="md"><svg class="icon"><use href="#icon-download"></use></svg> Markdown (.md)</button>
          <button data-export="html"><svg class="icon"><use href="#icon-download"></use></svg> HTML (.html)</button>
          <button data-export="pdf"><svg class="icon"><use href="#icon-download"></use></svg> PDF (.pdf)</button>
          <button data-export="txt"><svg class="icon"><use href="#icon-download"></use></svg> Plain text (.txt)</button>
        </div>
      </div>
    </div>

    <button id="moreBtn" class="icon-btn" title="More options" aria-label="More options"><svg class="icon"><use href="#icon-ellipsis-vertical"></use></svg></button>
  </header>

  <div id="body">

    <!-- Sidebar: document list -->
    <aside id="sidebar">
      <div id="sidebarHeader">
        <span>Documents</span>
        <button id="newDocBtn" class="icon-btn" title="New document" aria-label="New document"><svg class="icon"><use href="#icon-plus"></use></svg></button>
      </div>
      <ul id="docList"></ul>
      <div id="sidebarFooter">
        <label class="file-import-label">
          <svg class="icon"><use href="#icon-upload"></use></svg> Import .md
          <input id="importInput" type="file" accept=".md,.markdown,.txt" hidden>
        </label>
      </div>
      <input id="imageFileInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif" hidden>
    </aside>

    <!-- Editor + Preview -->
    <main id="main">
      <section id="editorPane" class="pane">
        <div id="toolbar">
          <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button data-cmd="strike" title="Strikethrough"><svg class="icon"><use href="#icon-strikethrough"></use></svg></button>
          <span class="sep"></span>
          <button data-cmd="h1" title="Heading 1">H1</button>
          <button data-cmd="h2" title="Heading 2">H2</button>
          <button data-cmd="h3" title="Heading 3">H3</button>
          <span class="sep"></span>
          <button data-cmd="quote" title="Blockquote"><svg class="icon"><use href="#icon-quote"></use></svg></button>
          <button data-cmd="code" title="Inline code"><svg class="icon"><use href="#icon-code"></use></svg></button>
          <button data-cmd="codeblock" title="Code block"><svg class="icon"><use href="#icon-braces"></use></svg></button>
          <span class="sep"></span>
          <button data-cmd="ul" title="Bullet list"><svg class="icon"><use href="#icon-list"></use></svg></button>
          <button data-cmd="ol" title="Numbered list"><svg class="icon"><use href="#icon-list-ordered"></use></svg></button>
          <button data-cmd="task" title="Task list"><svg class="icon"><use href="#icon-square-check"></use></svg></button>
          <span class="sep"></span>
          <button data-cmd="link" title="Link (Ctrl+K)"><svg class="icon"><use href="#icon-link"></use></svg></button>
          <button data-cmd="image" title="Image"><svg class="icon"><use href="#icon-image"></use></svg></button>
          <button data-cmd="table" title="Table"><svg class="icon"><use href="#icon-table"></use></svg></button>
          <button data-cmd="hr" title="Horizontal rule">―</button>
        </div>
        <div id="editorWrap"><textarea id="editor"></textarea></div>
      </section>

      <div id="divider"></div>

      <section id="previewPane" class="pane">
        <div id="preview"></div>
      </section>
    </main>
  </div>

  <footer id="statusbar">
    <span id="wordCount">0 words</span>
    <span id="charCount">0 characters</span>
    <span class="spacer"></span>
    <span id="cursorPos">Ln 1, Col 1</span>
  </footer>
</div>

<script src="js/app.js"></script>
<script type="module" src="js/collab.js"></script>
<script type="module" src="js/gist.js"></script>
</body>
</html>
