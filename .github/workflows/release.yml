name: Release

on:
  push:
    tags:
      - "v*"
  # A tag pushed by auto-tag.yml using the default GITHUB_TOKEN does NOT
  # fire this workflow's own push trigger above — GitHub deliberately
  # suppresses events produced by GITHUB_TOKEN to prevent recursive runs,
  # with workflow_dispatch/repository_dispatch as the documented
  # exceptions. auto-tag.yml calls this explicitly via workflow_dispatch
  # right after pushing the tag; the push trigger above still covers a
  # human (or a PAT) pushing a tag directly.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Process releases and backfill missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-helper.cjs
