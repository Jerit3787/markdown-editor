name: Auto Tag

on:
  push:
    branches:
      - master

# contents:write to push the version tag; actions:write to explicitly
# invoke release.yml afterward (see below for why that's necessary at all).
permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Tag if this version isn't tagged yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION already exists, skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"
          # The push above won't itself trigger release.yml's tag-push
          # trigger — GITHUB_TOKEN-authored pushes don't fire other
          # workflows' push triggers, only workflow_dispatch/
          # repository_dispatch are exempted from that. Ask for it
          # directly instead of relying on the (silently no-op) push event.
          gh workflow run release.yml --ref master
