name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Least-privilege default: none of these jobs write to the repo, open
# issues/PRs, or otherwise need more than read access to check out code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      # Non-blocking: `npm test` above is the gate. This re-runs the
      # suite with V8 coverage only to publish the summary + html
      # report as a build artifact. `continue-on-error` so a coverage
      # tooling hiccup never blocks a PR — there is no threshold yet.
      - name: Coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload component test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: component-test-screenshots
          path: tests/client/src/components/__screenshots__/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build client
        run: npm run build

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: No dev-login backdoor in committed source
        run: npm run check:no-dev-login

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run local e2e suite
        run: npm run test:e2e:local

      - name: Run mobile-WebKit e2e suite
        run: npm run test:e2e:webkit

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-collab:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run collab e2e suite
        run: npm run test:e2e:collab

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-collab
          path: playwright-report/
          retention-days: 7

  e2e-github:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets are unavailable to fork PRs — this `if` makes the job SKIP
    # (not fail) for them. NOT a required check: real GitHub is
    # rate-limited and its API drifts, so a red here is a signal to look,
    # never a merge gate. e2e-github.sh itself exits 0 (skip) if the
    # secrets aren't configured on the repo yet.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run GitHub e2e suite
        run: npm run test:e2e:github
        env:
          TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          TEST_GITHUB_USERNAME: ${{ secrets.TEST_GITHUB_USERNAME }}
          TEST_GITHUB_GIST_ID: ${{ secrets.TEST_GITHUB_GIST_ID }}
          TEST_GITHUB_REPO: ${{ secrets.TEST_GITHUB_REPO }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-github
          path: playwright-report/
          retention-days: 7
